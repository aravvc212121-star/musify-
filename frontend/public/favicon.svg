<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="cyan-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="100" ry="100" fill="#0a0a0a"/>
  <rect x="12" y="12" width="488" height="488" rx="90" ry="90" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <!-- R letter - vertical stroke -->
  <path d="M160 400 L160 140 Q160 110 185 110 L280 110 Q340 110 340 170 Q340 230 280 230 L220 230" 
        fill="none" stroke="#f0f0f0" stroke-width="38" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- R letter - cyan diagonal leg -->
  <line x1="240" y1="230" x2="360" y2="400" 
        stroke="url(#cyan-grad)" stroke-width="38" stroke-linecap="round"/>
  <!-- Cyan dot -->
  <circle cx="370" cy="110" r="16" fill="#22d3ee"/>
</svg>